  short_description: "Judge whether a technical proposal is a sound design"
  default_prompt: "Use $plan-review to independently judge whether this proposal forms a sound, coherent, executable technical design for the real system without avoidable long-lived complexity, identify established defects or decisive unknowns, and state which conclusions are established, what remains unresolved, and where those conclusions apply."
