interface:
  display_name: "Supervisor"
  short_description: "Control and recover long-running tasks by evidence"
  default_prompt: "Use $supervisor to establish or recover durable control state, route each established obligation to a matching specialist Worker or an ordinary Worker, reconcile Worker returns against their handoffs, and continue without performing domain work or imposing a fixed sequence until the task is Complete or Blocked."
policy:
  allow_implicit_invocation: false
