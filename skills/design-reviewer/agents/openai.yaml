interface:
  display_name: "Design Reviewer"
  short_description: "Challenge whether a technical or behavioral design is sound"
  default_prompt: "Use $design-reviewer to independently reconstruct the authorized outcome, design problem, and relevant real-world starting conditions, including the current system when one exists; trace pivotal commitments to established obligations before auditing their mechanisms; challenge the retained technical or behavioral route with relevant evidence and counterroutes; and report only established defects, decision-changing unknowns, and user-owned choices at the reviewed scope."
policy:
  allow_implicit_invocation: false
