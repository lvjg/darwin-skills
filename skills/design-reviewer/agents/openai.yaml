interface:
  display_name: "Design Reviewer"
  short_description: "Assess technical and Agent/Harness designs independently"
  default_prompt: "Use $design-reviewer to decide independently whether this submitted technical or Agent/Harness design supports the stated next decision. Establish the problem, real starting conditions, constraints, and evidence without adopting the proposal's framing; bind the judgment to the applicable proposal revision; identify and challenge the pivotal design judgments; and report the decision, achieved independence, evidence limits, established defects, decision-changing unknowns, and user-owned choices without rewriting the proposal."
policy:
  allow_implicit_invocation: false
