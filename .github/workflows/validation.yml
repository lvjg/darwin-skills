name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skill-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Validate Skill packages for pull request
        if: github.event_name == 'pull_request'
        run: ruby scripts/validate-skills.rb --base "${{ github.event.pull_request.base.sha }}"
      - name: Validate Skill packages on main
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=HEAD
          fi
          ruby scripts/validate-skills.rb --base "$base"

  eval-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Restore pinned Skill-Up validator
        id: skill-up-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/skill-up
          key: skill-up-v0.12.0-linux-amd64-ec2631e45702d460b69cd700e1847f5562ef2e971f09c23be2efcec4e0f583c6
      - name: Download pinned Skill-Up validator on cache miss
        if: steps.skill-up-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/skill-up.tar.gz https://github.com/alibaba/skill-up/releases/download/v0.12.0/skill-up_0.12.0_linux_amd64.tar.gz
          echo "ec2631e45702d460b69cd700e1847f5562ef2e971f09c23be2efcec4e0f583c6  /tmp/skill-up.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/skill-up.tar.gz -C "$HOME/.local/bin" skill-up
      - name: Check Skill-Up validator version
        run: "$HOME/.local/bin/skill-up --version"
      - name: Validate Anthropic eval sets through Skill-Up
        run: evals/run-evals --skill-up "$HOME/.local/bin/skill-up" --model ci-placeholder --dry-run
